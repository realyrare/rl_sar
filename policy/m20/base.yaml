# =============================================================================
# M20 基础配置 (base.yaml)
# -----------------------------------------------------------------------------
# 作用：描述「真实机器人硬件」层面的物理参数，以及 rl_sar 与硬件交互时的关节顺序。
#
# ★★ 最重要的一点 ★★
#   本文件 joint_names 的顺序，必须与 M20 真机 SDK 实际返回的关节顺序完全一致。
#   顺序错一位，机器人表面照常运动，但每条指令都打到了错误的关节上，极易摔机。
#
# 数据来源：robot_lab/source/robot_lab/robot_lab/assets/deeprobotics.py
#           中的 DEEPROBOTICS_M20_CFG (actuators / init_state)
#
# M20 关节顺序为：FL(前左) → FR(前右) → HL(后左) → HR(后右)
# 注意这与 Unitree 的 go2w (FR→FL→RR→RL) 不同，不可直接套用。
# =============================================================================

m20:
  # ===========================================================================
  # 一、时间参数
  # ===========================================================================

  # 底层电机控制周期（秒）。控制回路由此以 200Hz (5ms) 向真机下发关节指令。
  # 必须与 robot_lab 训练时的 sim.dt 一致，否则真机响应与训练分布不匹配。
  dt: 0.005

  # 降采样倍数。每执行 4 次底层控制，才做 1 次策略推理。
  # 策略实际运行频率 = 1 / (dt × decimation) = 1 / 0.02 = 50 Hz。
  # 必须与 robot_lab 训练配置中的 decimation 保持一致！
  decimation: 4

  # ===========================================================================
  # 二、自由度（DOF）
  # ===========================================================================

  # 总关节数 = 12 条腿关节(4条腿 × 3: hipx/hipy/knee) + 4 个轮关节 = 16
  num_of_dofs: 16

  # 哪些下标属于「轮子」。M20 的轮子排在最后 4 位（索引 12~15）。
  # rl_sar 据此区分两种控制方式：
  #   - 12 条腿关节 → 位置控制 (PD 输出目标角度)
  #   - 4  个轮关节 → 速度控制 (输出目标轮速)
  # 这是轮足机器人的核心差异点，配错会导致轮子被当成关节去"掰"，直接锁死。
  wheel_indices: [12, 13, 14, 15]

  # ===========================================================================
  # 三、PD 增益（Fixed 模式）
  # ---------------------------------------------------------------------------
  # fixed_kp / fixed_kd 用于「固定姿态」场景：
  #   - FSM 的起身状态 (RLFSMStateGetUp)
  #   - 被动模式 (RLFSMStatePassive) 把电机拉回 default_dof_pos 初始姿态
  #   - 尚未进入 RL 策略运行时的过渡阶段
  #
  # 取值沿用 robot_lab 训练时 DCMotorCfg 的 stiffness / damping：
  #   腿部 "joint" 执行器: stiffness=80.0, damping=2.0
  #   轮子 "wheel" 执行器: stiffness=0.0,  damping=0.6
  #
  # ★ 轮的 fixed_kp 必须为 0：轮子是速度控制对象，若给它位置闭环会直接抱死。
  # ===========================================================================

  fixed_kp: [80.0, 80.0, 80.0,   # FL: hipx, hipy, knee
             80.0, 80.0, 80.0,   # FR
             80.0, 80.0, 80.0,   # HL
             80.0, 80.0, 80.0,   # HR
             0.0, 0.0, 0.0, 0.0] # 4 个轮子：必须为 0

  fixed_kd: [2.0, 2.0, 2.0,      # FL
             2.0, 2.0, 2.0,      # FR
             2.0, 2.0, 2.0,      # HL
             2.0, 2.0, 2.0,      # HR
             0.6, 0.6, 0.6, 0.6] # 4 个轮子

  # ===========================================================================
  # 四、力矩限幅
  # ---------------------------------------------------------------------------
  # 安全阈值，防止单个关节输出过大力矩烧电机或发生危险动作。
  # 取值来自 robot_lab DCMotorCfg 的 effort_limit：
  #   腿 joint: effort_limit = 76.4 N·m
  #   轮 wheel: effort_limit = 21.6 N·m
  # ===========================================================================

  torque_limits: [76.4, 76.4, 76.4,   # FL
                  76.4, 76.4, 76.4,   # FR
                  76.4, 76.4, 76.4,   # HL
                  76.4, 76.4, 76.4,   # HR
                  21.6, 21.6, 21.6, 21.6]  # 4 个轮子

  # ===========================================================================
  # 五、初始/默认关节角（站立姿态）
  # ---------------------------------------------------------------------------
  # 机器人「标准站姿」时各关节的角度（弧度），作用有：
  #   1. FSM 起身动作的插值目标
  #   2. 观测归一化时 joint_pos 的相对零点
  #   3. 策略输出 action 时的叠加基准 (use_default_offset=True)
  #
  # 取值来自 robot_lab init_state.joint_pos。M20 是「内膝式」结构：
  #   前腿(f): hipy=-0.6, knee=+1.0   （膝向内弯）
  #   后腿(h): hipy=+0.6, knee=-1.0   （膝向外弯）
  #   hipx 侧摆与 wheel 均为 0
  #
  # ★ 这组值是 robot_lab 里 Environ 环境的初始姿态，必须与之一致，
  #   否则策略输出的"相对偏移量"会叠加到一个完全不同的站姿上。
  # ===========================================================================

  # ★ 必须是 16 个值，与 num_of_dofs 一致（之前误写成 18 个）
  default_dof_pos: [ 0.0, -0.6,  1.0,   # FL: hipx, hipy, knee
                     0.0, -0.6,  1.0,   # FR
                     0.0,  0.6, -1.0,   # HL
                     0.0,  0.6, -1.0,   # HR
                     0.0,  0.0,  0.0, 0.0]  # 4 个轮子初始为 0（不转）

  # ===========================================================================
  # 六、关节名称（★ 顺序必须与真机一致）
  # ---------------------------------------------------------------------------
  # robot_lab 中配置的顺序：leg_joint_names + wheel_joint_names
  #   leg  : FL → FR → HL → HR（每条腿 hipx, hipy, knee）
  #   wheel: fl, fr, hl, hr
  # ===========================================================================

  joint_names: ["fl_hipx_joint", "fl_hipy_joint", "fl_knee_joint",
                "fr_hipx_joint", "fr_hipy_joint", "fr_knee_joint",
                "hl_hipx_joint", "hl_hipy_joint", "hl_knee_joint",
                "hr_hipx_joint", "hr_hipy_joint", "hr_knee_joint",
                "fl_wheel_joint", "fr_wheel_joint",
                "hl_wheel_joint", "hr_wheel_joint"]

  # ===========================================================================
  # 七、关节控制器名称（Gazebo / ros_control 用）
  # ---------------------------------------------------------------------------
  # 仅在 Gazebo 仿真时需要：这里填写的名字必须与
  #   rl_sar_zoo/m20_description/config/robot_control.yaml
  # 里定义的 ros_control 控制器名一一对应，否则仿真无法驱动关节。
  # 纯真机部署时不会被使用。
  # ===========================================================================

  joint_controller_names: ["fl_hipx_controller", "fl_hipy_controller", "fl_knee_controller",
                           "fr_hipx_controller", "fr_hipy_controller", "fr_knee_controller",
                           "hl_hipx_controller", "hl_hipy_controller", "hl_knee_controller",
                           "hr_hipx_controller", "hr_hipy_controller", "hr_knee_controller",
                           "fl_wheel_controller", "fr_wheel_controller",
                           "hl_wheel_controller", "hr_wheel_controller"]

  # ===========================================================================
  # 八、关节映射
  # ---------------------------------------------------------------------------
  # joint_mapping[i] = 「本文件第 i 个关节」在 MuJoCo 里的编号。
  #
  # 本文件顺序（= robot_lab 训练顺序，rough_env_cfg.py:60-69）：
  #   0 fl_hipx, 1 fl_hipy, 2 fl_knee, 3 fr_hipx ... 11 hr_knee,
  #   12 fl_wheel, 13 fr_wheel, 14 hl_wheel, 15 hr_wheel
  #
  # MuJoCo 顺序（M20_rlsar.xml 按运动链深度优先展开，每腿完整链）：
  #   0 fl_hipx, 1 fl_hipy, 2 fl_knee, 3 fl_wheel, 4 fr_hipx ... 15 hr_wheel
  #
  # 两者不一致，所以【不能】用恒等映射：否则 rl_sar 的第 3 个关节 (fr_hipx)
  # 会读到 MuJoCo 的 fl_wheel，指令全部打错。
  #
  # 该索引同时被 GetState()（读 sensordata）和 SetCommand()（写 mj_data->ctrl）使用。
  #
  # 真机部署时：若 SDK 返回的关节顺序与 MuJoCo 一致（都是每腿完整链），
  # 该值可直接沿用；否则按实际 SDK 顺序重排。
  # ===========================================================================

  joint_mapping: [0, 1, 2,  4, 5, 6,  8, 9, 10,  12, 13, 14,  3, 7, 11, 15]
